
version: 2

models:
  - name: fct_sales
    description: >
      Gold fact table at order-item grain, combining sales,
      product, seller, customer, and delivery information.

    columns:
      - name: order_id
        description: Unique identifier of the order.
        data_tests:
          - not_null

      - name: order_item_id
        description: Identifier of the item within an order.
        data_tests:
          - not_null

      - name: product_id
        description: Identifier of the purchased product.
        data_tests:
          - not_null

      - name: seller_id
        description: Identifier of the seller.
        data_tests:
          - not_null

      - name: order_purchase_timestamp
        description: Timestamp when the order was placed.
        data_tests:
          - not_null

      - name: price
        description: Price of the order item.
        data_tests:
          - not_null

      - name: freight_value
        description: Freight charge associated with the order item.
        data_tests:
          - not_null